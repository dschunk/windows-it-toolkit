name: Feature request
description: Propose a reusable Windows administration capability
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Operational problem
      description: Describe the sysadmin task or risk, not only the desired command.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired output
      description: Explain the objects, properties, evidence, or workflow an administrator needs.
    validations:
      required: true
  - type: dropdown
    id: mutation
    attributes:
      label: Does this change system state?
      options: [No - read only, Yes - reversible, Yes - consequential, Unsure]
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Platform, module, and privilege requirements
  - type: checkboxes
    id: principles
    attributes:
      label: Project principles
      options:
        - label: The proposal can use safe defaults and structured PowerShell output.
          required: true
