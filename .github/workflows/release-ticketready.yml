name: TicketReady portable release

on:
  push:
    branches: [main]
    paths:
      - 'tools/TicketReady/**'
      - '.github/workflows/release-ticketready.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Parse TicketReady on Windows PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path tools/TicketReady/TicketReady.ps1).Path, [ref]$tokens, [ref]$errors
          )
          if ($errors.Count -gt 0) { $errors | Format-List; throw 'PowerShell parse errors' }

      - name: Run fictional demo and validate report privacy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/TicketReady/TicketReady.ps1 -Demo -NoBrowser -OutputDirectory "$PWD\demo"
          if ($LASTEXITCODE -ne 0) { throw 'Demo failed' }
          $html = Get-ChildItem demo/*.html | Select-Object -First 1
          $json = Get-ChildItem demo/*.json | Select-Object -First 1
          if (-not $html -or -not $json) { throw 'Demo output missing' }
          $data = Get-Content $json.FullName -Raw | ConvertFrom-Json
          if (-not $data.Demo -or $data.Disks.Count -ne 2) { throw 'Demo fixture incorrect' }
          if ($data.PSObject.Properties.Name -contains 'ComputerName') { throw 'Host name field should not exist' }
          $text = Get-Content $html.FullName -Raw
          if ($text -notmatch 'SAMPLE DATA' -or $text -notmatch 'Example Windows') { throw 'Sample report invalid' }
          if ($text -match '<script') { throw 'Report must be self-contained and script-free' }

      - name: Verify v0.2 privacy, guidance and baseline comparison
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $first = (Get-ChildItem demo/*.json | Select-Object -First 1).FullName
          $before = Get-Content $first -Raw | ConvertFrom-Json
          if ($before.Windows.Hardware -ne 'Hidden for privacy' -or $before.IncludesDeviceModel) {
            throw 'Hardware should be hidden by default'
          }
          if ($before.Changes.Count -ne 0 -or $before.BaselineCompared) {
            throw 'Baseline should be opt-in'
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/TicketReady/TicketReady.ps1 -Demo -Issue Storage -IncludeDeviceModel -BaselinePath $first -NoBrowser -OutputDirectory "$PWD\compare"
          if ($LASTEXITCODE -ne 0) { throw 'Comparison failed' }
          $compared = Get-Content (Get-ChildItem compare/*.json | Select-Object -First 1).FullName -Raw | ConvertFrom-Json
          if (-not $compared.BaselineCompared -or $compared.IssueType -ne 'Storage' -or
              $compared.Changes.Count -lt 2 -or $compared.NextSteps.Count -ne 3) {
            throw 'Comparison or guide invalid'
          }
          if ($compared.Windows.Hardware -notmatch 'Example Computer') {
            throw 'Opt-in model unavailable'
          }
          $reportHtml = Get-Content (Get-ChildItem compare/*.html | Select-Object -First 1).FullName -Raw
          if ($reportHtml -notmatch 'Before and after' -or $reportHtml -notmatch 'Suggested next steps') {
            throw 'Report is missing v0.2 features'
          }
          if ($reportHtml -match '<script') { throw 'Local report must not embed scripts' }

      - name: Run real Windows smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/TicketReady/TicketReady.ps1 -NoBrowser -OutputDirectory "$PWD\smoke"
          if ($LASTEXITCODE -ne 0) { throw 'Real diagnostic run failed' }
          $json = Get-ChildItem smoke/*.json | Select-Object -First 1
          if (-not $json) { throw 'Windows report not generated' }
          $result = Get-Content $json.FullName -Raw | ConvertFrom-Json
          if ($result.Demo -or -not $result.Windows.Name) { throw 'Unexpected report values' }

      - name: Validate guided menu branches
        shell: pwsh
        run: |
          $launcher = Get-Content tools/TicketReady/RUN-TicketReady-Guided.cmd -Raw
          foreach ($item in @('5 goto updates','4 goto network','3 goto storage','2 goto slowpc',':general',':run')) {
            if (-not $launcher.Contains($item)) { throw "Missing guided menu branch: $item" }
          }
          if ($launcher -match '(?m)^if errorlevel [2-5] set .*&goto') {
            throw 'Guided menu uses an unconditional goto chain'
          }
          if (-not $launcher.Contains('TicketReady.ps1" -Issue "%ISSUE%"')) {
            throw 'Guided menu does not pass selected issue to PowerShell'
          }

      - name: Assemble distributable ZIP and hash
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist, staging/TicketReady | Out-Null
          Copy-Item tools/TicketReady/TicketReady.ps1 staging/TicketReady/
          Copy-Item tools/TicketReady/RUN-TicketReady.cmd staging/TicketReady/
          Copy-Item tools/TicketReady/RUN-TicketReady-Guided.cmd staging/TicketReady/
          Copy-Item tools/TicketReady/README.md staging/TicketReady/
          Copy-Item LICENSE staging/TicketReady/LICENSE.txt
          Copy-Item (Get-ChildItem demo/*.html | Select-Object -First 1).FullName staging/TicketReady/SAMPLE-REPORT.html
          if (-not (Test-Path staging/TicketReady/RUN-TicketReady-Guided.cmd)) { throw 'Guided launcher missing' }
          Compress-Archive -Path staging/TicketReady -DestinationPath dist/TicketReady-v0.2.2.zip -Force
          $hash = (Get-FileHash dist/TicketReady-v0.2.2.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  TicketReady-v0.2.2.zip" | Set-Content dist/SHA256SUMS.txt -Encoding ascii

      - name: Upload portable package as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TicketReady-Windows-v0.2.2
          path: dist/
          if-no-files-found: error

      - name: Publish first GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = 'ticketready-v0.2.2'
          gh release view $tag --json url 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release already exists; not overwriting its assets."
          } else {
            gh release create $tag dist/TicketReady-v0.2.2.zip dist/SHA256SUMS.txt --target $env:GITHUB_SHA --title "TicketReady v0.2.2 - portable Windows support report" --notes "TicketReady v0.2 adds guided troubleshooting, before-and-after comparisons and stronger privacy defaults. Offline, read-only Windows support report with HTML/JSON export. No telemetry, installation, cloud upload, or administrator elevation. Review local reports before sharing."
            if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed' }
          }
